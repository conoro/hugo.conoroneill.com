name: Hugo compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the tested Hugo version
        env:
          HUGO_VERSION: '0.170.0'
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 --remote-name "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --remote-name "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Reject preview output committed to Pages
        run: python3 scripts/check_publication.py docs
      - name: Verify a production build
        run: |
          hugo --environment production --panicOnWarning --destination "$RUNNER_TEMP/hugo-site"
          python3 scripts/check_publication.py "$RUNNER_TEMP/hugo-site"

